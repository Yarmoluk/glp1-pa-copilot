<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000"><title>The model can write. It cannot invent an edge.</title><desc>Nine declared requires edges from the synthetic GLP-1 policy fixture, followed by an optional verbalizer, citation gate and human review. A fabricated edge is rejected.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071b27"/><stop offset="1" stop-color="#103b40"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#6de6c4" stroke-width="1.3"/></marker></defs><rect width="1600" height="2000" fill="url(#bg)"/><circle cx="1490" cy="100" r="470" fill="#6de6c4" opacity=".025"/><g font-family="Arial, Helvetica, sans-serif"><text x="80" y="82" font-size="22" font-weight="700" fill="#6de6c4">DANIEL YARMOLUK  /  FORWARD DEPLOYED ENGINEERING</text><text x="80" y="184" font-size="80" font-weight="700" fill="#f1f6ed">The model can write.</text><text x="80" y="276" font-size="80" font-weight="700" fill="#f1f6ed">It cannot invent an edge.</text><text x="80" y="335" font-size="28" font-weight="400" fill="#d5e5e5">GLP-1 prior-authorization draft gate · Synthetic portfolio engagement</text><path d="M80 374H1520" stroke="#326069"/><text x="80" y="420" font-size="22" font-weight="700" fill="#6de6c4">01  WALK THE DECLARED GRAPH</text><text x="80" y="462" font-size="24" font-weight="700" fill="#f1f6ed">Actual fixture topology</text><text x="80" y="497" font-size="21" font-weight="400" fill="#d5e5e5">Every arrow means “requires”.</text><path d="M380 870.0 C490 870.0 500 580.0 642 580.0" fill="none" stroke="#6de6c4" stroke-width="3" opacity=".8" marker-end="url(#arrow)"/><text x="545" y="567.0" font-size="20" font-weight="700" fill="#6de6c4">PA-E01</text><path d="M1020 580.0 H1162" fill="none" stroke="#6de6c4" stroke-width="3" opacity=".8" marker-end="url(#arrow)"/><text x="1045" y="565" font-size="20" font-weight="700" fill="#6de6c4">PA-E02</text><path d="M380 870.0 C490 870.0 500 690.0 642 690.0" fill="none" stroke="#6de6c4" stroke-width="3" opacity=".8" marker-end="url(#arrow)"/><text x="545" y="677.0" font-size="20" font-weight="700" fill="#6de6c4">PA-E03</text><path d="M380 870.0 C490 870.0 500 800.0 642 800.0" fill="none" stroke="#6de6c4" stroke-width="3" opacity=".8" marker-end="url(#arrow)"/><text x="545" y="787.0" font-size="20" font-weight="700" fill="#6de6c4">PA-E04</text><path d="M380 870.0 C490 870.0 500 910.0 642 910.0" fill="none" stroke="#6de6c4" stroke-width="3" opacity=".8" marker-end="url(#arrow)"/><text x="545" y="897.0" font-size="20" font-weight="700" fill="#6de6c4">PA-E05</text><path d="M380 870.0 C490 870.0 500 1020.0 642 1020.0" fill="none" stroke="#6de6c4" stroke-width="3" opacity=".8" marker-end="url(#arrow)"/><text x="545" y="1007.0" font-size="20" font-weight="700" fill="#6de6c4">PA-E06</text><path d="M380 870.0 C490 870.0 500 1130.0 642 1130.0" fill="none" stroke="#6de6c4" stroke-width="3" opacity=".8" marker-end="url(#arrow)"/><text x="545" y="1117.0" font-size="20" font-weight="700" fill="#6de6c4">PA-E07</text><path d="M380 870.0 C490 870.0 500 1240.0 642 1240.0" fill="none" stroke="#6de6c4" stroke-width="3" opacity=".8" marker-end="url(#arrow)"/><text x="545" y="1227.0" font-size="20" font-weight="700" fill="#6de6c4">PA-E08</text><path d="M380 870.0 C490 870.0 500 1350.0 642 1350.0" fill="none" stroke="#6de6c4" stroke-width="3" opacity=".8" marker-end="url(#arrow)"/><text x="545" y="1337.0" font-size="20" font-weight="700" fill="#6de6c4">PA-E09</text><rect x="80" y="800" width="300" height="140" rx="16" fill="#194e50" stroke="#6de6c4" stroke-width="2"/><text x="104" y="843" font-size="18" font-weight="700" fill="#6de6c4">SYNTHETIC REQUEST</text><text x="104" y="883" font-size="32" font-weight="700" fill="#f1f6ed">Wegovy start</text><text x="104" y="917" font-size="20" font-weight="400" fill="#d5e5e5">Rule walk begins here</text><rect x="650" y="540" width="370" height="80" rx="16" fill="#12333e" stroke="#326069" stroke-width="2"/><text x="670" y="573" font-size="23" font-weight="700" fill="#f1f6ed">Adult weight-management</text><text x="670" y="601" font-size="20" font-weight="400" fill="#d5e5e5">scope</text><rect x="1170" y="540" width="350" height="80" rx="16" fill="#12333e" stroke="#326069" stroke-width="2"/><text x="1190" y="573" font-size="23" font-weight="700" fill="#f1f6ed">BMI criterion</text><text x="1190" y="601" font-size="20" font-weight="400" fill="#d5e5e5">with comorbidity branch</text><rect x="650" y="650" width="370" height="80" rx="16" fill="#12333e" stroke="#326069" stroke-width="2"/><text x="670" y="683" font-size="23" font-weight="700" fill="#f1f6ed">Starting dose</text><text x="670" y="711" font-size="20" font-weight="400" fill="#d5e5e5">0.25 mg weekly</text><rect x="650" y="760" width="370" height="80" rx="16" fill="#12333e" stroke="#326069" stroke-width="2"/><text x="670" y="793" font-size="23" font-weight="700" fill="#f1f6ed">Lifestyle program</text><text x="670" y="821" font-size="20" font-weight="400" fill="#d5e5e5">documented</text><rect x="650" y="870" width="370" height="80" rx="16" fill="#12333e" stroke="#326069" stroke-width="2"/><text x="670" y="903" font-size="23" font-weight="700" fill="#f1f6ed">Prior therapy</text><text x="670" y="931" font-size="20" font-weight="400" fill="#d5e5e5">or documented exception</text><rect x="650" y="980" width="370" height="80" rx="16" fill="#12333e" stroke="#326069" stroke-width="2"/><text x="670" y="1013" font-size="23" font-weight="700" fill="#f1f6ed">Contraindications</text><text x="670" y="1041" font-size="20" font-weight="400" fill="#d5e5e5">submitted safety check</text><rect x="650" y="1090" width="370" height="80" rx="16" fill="#12333e" stroke="#326069" stroke-width="2"/><text x="670" y="1123" font-size="23" font-weight="700" fill="#f1f6ed">Concurrent GLP-1 therapy</text><text x="670" y="1151" font-size="20" font-weight="400" fill="#d5e5e5">combination check</text><rect x="650" y="1200" width="370" height="80" rx="16" fill="#12333e" stroke="#326069" stroke-width="2"/><text x="670" y="1233" font-size="23" font-weight="700" fill="#f1f6ed">eGFR documented</text><text x="670" y="1261" font-size="20" font-weight="400" fill="#d5e5e5">No cutoff encoded</text><rect x="650" y="1310" width="370" height="80" rx="16" fill="#12333e" stroke="#326069" stroke-width="2"/><text x="670" y="1343" font-size="23" font-weight="700" fill="#f1f6ed">A1c documented</text><text x="670" y="1371" font-size="20" font-weight="400" fill="#d5e5e5">No eligibility cutoff</text><rect x="80" y="1030" width="330" height="180" rx="16" fill="#253b3a" stroke="#a18a53" stroke-width="2"/><text x="104" y="1070" font-size="20" font-weight="700" fill="#f1c57b">NO SUPPORTING EDGE?</text><text x="104" y="1120" font-size="39" font-weight="700" fill="#f1c57b">MISSING</text><text x="104" y="1160" font-size="20" font-weight="400" fill="#d5e5e5">A visible gap for the reviewer.</text><text x="1120" y="707" font-size="20" font-weight="700" fill="#6de6c4">02  WORD THE RETURNED PATH</text><rect x="1120" y="732" width="400" height="105" rx="16" fill="#123942" stroke="#326069" stroke-width="2"/><text x="1144" y="772" font-size="27" font-weight="700" fill="#f1f6ed">Optional verbalizer</text><text x="1144" y="806" font-size="20" font-weight="400" fill="#d5e5e5">Receives rule-walk results only</text><path d="M1320 843V877" fill="none" stroke="#6de6c4" stroke-width="3" opacity=".8" marker-end="url(#arrow)"/><rect x="1120" y="888" width="400" height="105" rx="16" fill="#123942" stroke="#326069" stroke-width="2"/><text x="1144" y="928" font-size="26" font-weight="700" fill="#f1f6ed">Citation + outcome gate</text><text x="1144" y="962" font-size="20" font-weight="400" fill="#d5e5e5">Returned edge IDs or MISSING</text><rect x="1120" y="1012" width="400" height="92" rx="16" fill="#392c33" stroke="#b67778" stroke-width="2"/><text x="1144" y="1049" font-size="18" font-weight="700" fill="#f1ac9e">HOSTILE STUB TEST</text><text x="1144" y="1083" font-size="22" font-weight="700" fill="#f1ac9e">PA-E999 invented → REJECTED</text><text x="1120" y="1170" font-size="20" font-weight="700" fill="#6de6c4">03  HUMAN ACCEPTS OR EDITS</text><rect x="1120" y="1195" width="400" height="135" rx="16" fill="#194e50" stroke="#6de6c4" stroke-width="2"/><text x="1144" y="1235" font-size="29" font-weight="700" fill="#f1f6ed">pending_review</text><text x="1144" y="1270" font-size="20" font-weight="400" fill="#d5e5e5">Named reviewer · edit diff logged</text><text x="1144" y="1304" font-size="22" font-weight="700" fill="#6de6c4">Submit remains blocked</text><text x="80" y="1438" font-size="22" font-weight="700" fill="#6de6c4">FROZEN SYNTHETIC TEST SPLIT · 20 CASES</text><rect x="80" y="1470" width="460" height="165" rx="16" fill="#0c2933" stroke="#326069" stroke-width="2"/><text x="108" y="1545" font-size="58" font-weight="700" fill="#f1f6ed">0</text><text x="108" y="1595" font-size="23" font-weight="400" fill="#d5e5e5">invalid actions</text><rect x="570" y="1470" width="460" height="165" rx="16" fill="#0c2933" stroke="#326069" stroke-width="2"/><text x="598" y="1545" font-size="58" font-weight="700" fill="#f1f6ed">3 / 3</text><text x="598" y="1595" font-size="23" font-weight="400" fill="#d5e5e5">out-of-graph asks abstained</text><rect x="1060" y="1470" width="460" height="165" rx="16" fill="#0c2933" stroke="#326069" stroke-width="2"/><text x="1088" y="1545" font-size="58" font-weight="700" fill="#f1f6ed">100%</text><text x="1088" y="1595" font-size="23" font-weight="400" fill="#d5e5e5">citation coverage</text><text x="80" y="1690" font-size="26" font-weight="700" fill="#f1f6ed">Hand-written nine-edge synthetic policy overlay.</text><text x="80" y="1730" font-size="24" font-weight="400" fill="#d5e5e5">The published glp1-obesity CKG and ckg-mcp are not loaded here.</text><text x="80" y="1770" font-size="23" font-weight="400" fill="#d5e5e5">Fixture results demonstrate gate behavior; they do not establish generalization.</text><path d="M80 1830H1520" stroke="#326069"/><text x="80" y="1887" font-size="23" font-weight="700" fill="#6de6c4">EXPLORE THE GRAPH. CLONE THE REPO. TEST THE BOUNDARY.</text><text x="80" y="1936" font-size="30" font-weight="700" fill="#f1f6ed">yarmoluk.github.io/glp1-pa-copilot</text></g></svg>