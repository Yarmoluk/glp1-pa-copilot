[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glp1-pa-copilot"
version = "0.3.0"
description = "Synthetic, graph-grounded GLP-1 prior-authorization draft gate"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
live = ["openai>=2,<3"]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
