site_name: GLP-1 PA draft copilot
site_description: A synthetic, graph-grounded prior-authorization draft workflow with a human review gate.
site_url: https://yarmoluk.github.io/glp1-pa-copilot/
repo_url: https://github.com/Yarmoluk/glp1-pa-copilot
repo_name: Yarmoluk/glp1-pa-copilot
copyright: © 2026 Daniel Yarmoluk · Synthetic portfolio engagement
nav:
  - Start here: index.md
  - Explore the graph: graph.md
  - Run the demo: run.md
  - How it works: how-it-works.md
  - Public demo scope: scope.md
  - Evaluation: evaluation.md
  - Decisions and handoff:
      - Discovery: discovery.md
      - Action boundary: action-boundary.md
      - Graph, not RAG: adr-001-graph-not-rag.md
      - Shadow week: shadow-week.md
      - Engineer handoff: handoff.md
theme:
  name: material
  language: en
  logo: assets/mark.svg
  favicon: assets/mark.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/graph-data.js
  - javascripts/graph.js
