<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
<title id="title">From request to reviewable reasoning</title><desc id="desc">A synthetic GLP-1 case enters a declared policy graph. A returned edge supports one cited sentence, which stops at human review. A missing edge produces an explicit gap.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e3338"/><stop offset="1" stop-color="#174e4b"/></linearGradient><linearGradient id="glow"><stop stop-color="#75d8ba"/><stop offset="1" stop-color="#b9f0c9"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#061e21" flood-opacity=".25"/></filter></defs>
<rect width="1440" height="520" rx="28" fill="url(#bg)"/><circle cx="1270" cy="40" r="290" fill="#8fe8cb" opacity=".035"/><circle cx="850" cy="540" r="300" fill="#b8eeda" opacity=".035"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="78" y="88" font-size="20" font-weight="700" letter-spacing="3" fill="#8edfc6">SYNTHETIC PAYER ENGAGEMENT</text><text x="78" y="164" font-size="49" font-weight="700" fill="#f4f8ee">From request to</text><text x="78" y="224" font-size="49" font-weight="700" fill="#f4f8ee">reviewable reasoning.</text><text x="78" y="284" font-size="23" fill="#c5ddd5">One declared edge. One cited sentence.</text><text x="78" y="320" font-size="23" fill="#c5ddd5">A visible gap when evidence is absent.</text><rect x="78" y="375" width="330" height="58" rx="11" fill="#def5e7"/><text x="105" y="412" font-size="20" font-weight="700" fill="#103b38">Human review is the final gate</text></g>
<g stroke-linecap="round" stroke-linejoin="round"><path d="M777 259C824 259 836 184 881 184" fill="none" stroke="#75d8ba" stroke-width="4"/><path d="M777 259C824 259 836 339 881 339" fill="none" stroke="#f3bc71" stroke-width="3" stroke-dasharray="7 10"/><path d="M1040 184C1088 184 1090 259 1130 259" fill="none" stroke="#75d8ba" stroke-width="4"/><path d="M1040 339C1088 339 1090 259 1130 259" fill="none" stroke="#f3bc71" stroke-width="3" stroke-dasharray="7 10"/><path d="M1246 259h66" stroke="#75d8ba" stroke-width="4"/></g>
<g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif"><rect x="650" y="206" width="142" height="106" rx="18" fill="#f4f8ee"/><text x="674" y="243" font-size="16" font-weight="700" fill="#1b4a46">CASE FACT</text><text x="674" y="277" font-size="23" font-weight="700" fill="#103b38">BMI 33.2</text><rect x="864" y="128" width="192" height="112" rx="18" fill="#dff5e8"/><text x="888" y="164" font-size="16" font-weight="700" fill="#257b66">DECLARED EDGE</text><text x="888" y="201" font-size="29" font-weight="700" fill="#103b38">PA-E02</text><rect x="864" y="286" width="192" height="112" rx="18" fill="#fff0d8"/><text x="888" y="322" font-size="16" font-weight="700" fill="#9a641f">NO EVIDENCE?</text><text x="888" y="359" font-size="26" font-weight="700" fill="#74491b">MISSING</text><rect x="1118" y="206" width="140" height="106" rx="18" fill="#f4f8ee"/><text x="1142" y="242" font-size="16" font-weight="700" fill="#1b4a46">DRAFT</text><text x="1142" y="277" font-size="21" font-weight="700" fill="#103b38">[PA-E02]</text><rect x="1300" y="213" width="100" height="92" rx="18" fill="#75d8ba"/><text x="1321" y="250" font-size="14" font-weight="700" fill="#103b38">NURSE</text><text x="1315" y="277" font-size="14" font-weight="700" fill="#103b38">REVIEW</text></g>
<g fill="url(#glow)"><circle cx="824" cy="222" r="6"/><circle cx="1090" cy="222" r="6"/></g>
</svg>
